name: Windows native tests
on:
  push:
    branches: [main, development/windows-native-tests]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install PyQt6 numpy psutil cryptography httpx google-genai sounddevice
      - name: Verify native Windows runtime and launcher
        run: .venv\Scripts\python.exe tools/windows/native_smoke.py
      - name: Desktop and offline regression tests
        run: .venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Early access regression tests
        working-directory: early_access/v73_1
        run: ..\..\.venv\Scripts\python.exe -m unittest discover -s tests -v
